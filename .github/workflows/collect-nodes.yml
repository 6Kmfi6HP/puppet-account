# collect-nodes — 每日在 GitHub Actions 上提取 FreeSocks 节点，明文落到 `nodes` 分支。
#
# 依赖（并行任务 M1）：bin/register.ts 的
#   --save-link <path>    生成「订阅链接一行一个」txt
#   --save-content <path> 生成「订阅内容」txt
# 本 workflow 只调用该 CLI 并把两份 txt 明文入库（仓库公开，节点直接公开显示，不做加密），
# 不修改 bin/ 或 src/。不需要任何 Secret。
#
# ⚠️ Cap 通过方式：本项目自带的 `--pow` 纯协议 PoW（不启动浏览器，runner 上无 Chromium/xvfb）。
# 若生产服务端开启 Cap instrumentation 并拒绝纯 PoW（错误名 cap.instr_blocked），
# 提取步骤会以非零码结束、本次不发布任何产物：这是可接受的表现，
# 重试机制 = Actions 失败运行记录的人工重放 + 下一天 schedule 自然重试。
#
# 后果分支名：`nodes`（独立 orphan 分支）。为了订阅 URL 永远稳定，每次运行
# 都覆盖仓库根目录下的同两个固定文件（process 语义是"latest 快照"）：
#   - links.txt    订阅链接，每行一个，直接可被阅读器订阅
#   - content.txt  订阅内容（抓取订阅链接后的正文）
# 之后若要加「每日历史备份」再引入 dated/ 子目录，不影响这两个固定入口。
#
# 失败时人工重放：Actions 页签 → 本 workflow（collect-nodes）→ Run workflow
# （选 main 分支）手动触发；每次会覆盖同名固定文件，内容以最后一次成功提取为准。
#
# ✅ 注意：push 到 nodes 分支用的是 GITHUB_TOKEN，默认权限下 GITHUB_TOKEN 触发的
# push 事件不会再启动新的 workflow run（GitHub 保护机制，防止递归触发），
# 因此既不需要 [skip ci]，也不会与 ci.yml（push: main / pull_request 触发）相互干扰；
# nodes 分支也没有 push 触发器挂到本 workflow 上（下方只有 schedule + workflow_dispatch）。
name: collect-nodes

on:
  schedule:
    - cron: '23 4 * * *'  # 每天 04:23 UTC（非整点）执行一次
  workflow_dispatch:

permissions:
  contents: write  # 允许 GITHUB_TOKEN push 到 nodes 分支

concurrency:
  group: nodes-collect
  cancel-in-progress: false  # 排队而非取消，避免并发写 nodes 分支

jobs:
  extract:
    name: Extract and publish nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract nodes (pure protocol PoW, no browser)
        id: extract
        run: |
          set -euo pipefail
          mkdir -p out
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "ts=${TS}" >> "$GITHUB_OUTPUT"

          set +e
          bun run bin/register.ts --pow --json --save-link out/links.txt --save-content out/content.txt > out/stdout.json 2> out/stderr.log
          rc=$?
          set -e

          # 先把产物文件与 stdout/stderr 中出现的关键字段（订阅链接等）全部 add-mask，
          # 之后任何日志输出即使包含这些值也会被 GitHub 自动打码。
          # grep 无匹配时 exit 1，会在 pipefail + set -e 下误判整步失败，故整套管道加 || true。
          for f in out/links.txt out/content.txt out/stdout.json out/stderr.log; do
            [ -f "$f" ] || continue
            { grep -oE '(https?|vmess|ss|trojan|vless)://[^[:space:]"'"'"'<>]+' "$f" || true; } | sort -u | while IFS= read -r u; do
              [ -n "$u" ] && echo "::add-mask::${u}"
            done
          done
          for f in out/links.txt out/content.txt; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done < "$f"
          done

          echo "register exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::register failed (exit ${rc}); last stderr lines (URLs masked):"
            tail -n 40 out/stderr.log || true
            exit "$rc"
          fi

          : > out/ok
          if ! test -s out/links.txt; then
            echo "::error::links file empty or missing"
            exit 1
          fi
          if ! test -s out/content.txt; then
            echo "::error::content file empty or missing"
            exit 1
          fi
          echo "links=$(wc -l < out/links.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish to orphan branch `nodes`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TS: ${{ steps.extract.outputs.ts }}
        run: |
          set -euo pipefail
          TODAY="${TS:0:8}"                     # YYYYMMDD (UTC, 取自提取时刻)
          CUTOFF="$(date -u -d "-6 days" +%Y%m%d)"  # 阈值，保留 TODAY-CUTOFF+1=7 个日期（含当天）
          PUB="${RUNNER_TEMP}/nodes-pub"

          git init -b nodes "${PUB}"
          cd "${PUB}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # nodes 已是 orphan：首次 push 直接创建；已存在则基于其 tip 续写历史，
          # 绝不抓取/合入 main 或其他分支。
          if git fetch --depth=1 origin nodes; then
            git checkout -B nodes FETCH_HEAD
          fi

          # ============ 7 天滚动增量合并 ============
          # history/links/<YYYYMMDD>.txt   —— 当天提取的所有订阅 URL (一行一个)
          # history/content/<YYYYMMDD>/    —— 当天每个 URL 抓到的 content body
          #     <base64url(url)>.txt       —— 文件名是 URL 的 base64url，同 URL 多次提取会覆盖
          #
          # links.txt     = 近 7 天 (TODAY-6 .. TODAY) 的 links/*.txt 合并去重
          # content.txt   = 近 7 天每个 URL 的 latest body 直接拼接 (空行分隔)
          #
          # 站点会做服务端去重时，同一 URL 重复出现不会制造重复节点。

          mkdir -p history/links "history/content/${TODAY}"

          # 合并当天 run 到 history/links/<YYYYMMDD>.txt
          touch "history/links/${TODAY}.txt"
          if [ -f out/links.txt ]; then
            cat out/links.txt "history/links/${TODAY}.txt" 2>/dev/null \
              | awk 'NF' | sort -u > history/links.tmp
            mv history/links.tmp "history/links/${TODAY}.txt"
          fi

          # 把当天 run 的 content 按 URL 分文件存到 history/content/<YYYYMMDD>/
          if [ -f out/links.txt ] && [ -f out/content.txt ]; then
            SPLIT_DIR="${RUNNER_TEMP}/split-new"
            rm -rf "${SPLIT_DIR}"
            mkdir -p "${SPLIT_DIR}"
            awk 'BEGIN{RS=""; FS="\n"} {fn=sprintf("%s/part-%06d.txt", "'"${SPLIT_DIR}"'", NR); print > fn; close(fn)}' \
              out/content.txt
            N_NEW=$(awk 'NF' out/links.txt | wc -l | tr -d ' ')
            i=0
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              i=$((i + 1))
              KEY="$(printf '%s' "$url" | base64 | tr '+/' '-_' | tr -d '=')"
              PART="${SPLIT_DIR}/part-$(printf '%06d' "$i").txt"
              if [ -f "$PART" ]; then
                cp "$PART" "history/content/${TODAY}/${KEY}.txt"
              fi
            done < out/links.txt
          fi

          # 丢弃超过 7 天的 history (history/links 是 .txt 文件；history/content 是日期子目录)
          for f in history/links/*.txt; do
            [ -e "$f" ] || continue
            name="$(basename "${f%.txt}")"
            if [ "$name" -lt "$CUTOFF" ] 2>/dev/null; then
              rm -f "$f"
            fi
          done
          for d in history/content/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            if [ "$name" -lt "$CUTOFF" ] 2>/dev/null; then
              rm -rf "$d"
            fi
          done

          # 由近 7 天快照重建固定 links.txt
          : > links.txt
          for i in 0 1 2 3 4 5 6; do
            f="history/links/$(date -u -d "-${i} days" +%Y%m%d).txt"
            [ -f "$f" ] && cat "$f"
          done | sort -u > links.txt.tmp
          mv links.txt.tmp links.txt

          # 由近 7 天快照重建固定 content.txt (对近 7 天每个 URL 取最新 body)
          TMP_NEW="${RUNNER_TEMP}/content-new"
          rm -rf "${TMP_NEW}"
          mkdir -p "${TMP_NEW}"
          for i in 0 1 2 3 4 5 6; do
            d="$(date -u -d "-${i} days" +%Y%m%d)"
            if [ -d "history/content/${d}" ]; then
              cp "history/content/${d}/"*.txt "${TMP_NEW}/" 2>/dev/null || true
            fi
          done
          : > content.txt
          first=1
          for f in "${TMP_NEW}"/*.txt; do
            [ -f "$f" ] || continue
            if [ "$first" -eq 0 ]; then
              printf '\n' >> content.txt
            fi
            cat "$f" >> content.txt
            first=0
          done

          git add links.txt content.txt history
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          # 不加 [skip ci]：GITHUB_TOKEN 触发的 push 默认不再启动新的 workflow run
          # （GitHub 官方保护机制防递归），见文件顶部注释。
          git commit -m "nodes: links+content run ${GITHUB_RUN_ID} (${TS})"
          git push origin nodes

      - name: Summary
        if: always()
        run: |
          if [ -f out/ok ]; then
            TS="${{ steps.extract.outputs.ts }}"
            echo "- run id: \`${GITHUB_RUN_ID}\`"
            echo "- links extracted: \`${{ steps.extract.outputs.links }}\`"
            echo "- artifacts on \`nodes\` branch (固定路径，URL 永不变化):"
            echo "  - \`links.txt\`   -> raw.githubusercontent.com/${GITHUB_REPOSITORY}/nodes/links.txt"
            echo "  - \`content.txt\` -> raw.githubusercontent.com/${GITHUB_REPOSITORY}/nodes/content.txt"
          else
            echo "::warning::Extraction step failed — nothing was published. Re-run via Actions → collect-nodes → Run workflow."
          fi
