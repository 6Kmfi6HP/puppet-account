# collect-nodes — 每日在 GitHub Actions 上提取 FreeSocks 节点，明文落到 `nodes` 分支。
#
# 依赖（并行任务 M1）：bin/register.ts 的
#   --save-link <path>    生成「订阅链接一行一个」txt
#   --save-content <path> 生成「订阅内容」txt
# 本 workflow 只调用该 CLI 并把两份 txt 明文入库（仓库公开，节点直接公开显示，不做加密），
# 不修改 bin/ 或 src/。不需要任何 Secret。
#
# ⚠️ Cap 通过方式：本项目自带的 `--pow` 纯协议 PoW（不启动浏览器，runner 上无 Chromium/xvfb）。
# 若生产服务端开启 Cap instrumentation 并拒绝纯 PoW（错误名 cap.instr_blocked），
# 提取步骤会以非零码结束、本次不发布任何产物：这是可接受的表现，
# 重试机制 = Actions 失败运行记录的人工重放 + 下一天 schedule 自然重试。
#
# 多模式提取：register 用 `--mode all`，一个账号遍历 public config 中所有
# available 的 connection-mode，每个模式 setConnectionMode → regenerate 出一份
# 订阅；links.txt 每模式一行，content.txt 按相同顺序每模式一段（下方 python
# 的「空行分段 + 第 i 段对应第 i 条 link」逻辑天然兼容）。
#
# 后果分支名：`nodes`（独立 orphan 分支）。每次运行把当天提取追加进 history/，
# 并重建两个固定入口文件（链接/内容都会一直包含近 7 天的累计结果）：
#   - links.txt    近 7 天合并去重后的订阅链接（一行一个）
#   - content.txt  近 7 天所有链接的最新 body 先 base64 解码、逐行聚合去重、再 base64
#                  编码——这是 v2ray/clash 类客户端可直接消费的「订阅」形态。
# 历史目录结构：history/links/<YYYYMMDD>.txt、history/content/<YYYYMMDD>/<url-key>.txt。
#
# 失败时人工重放：Actions 页签 → 本 workflow（collect-nodes）→ Run workflow
# （选 main 分支）手动触发；每次会覆盖同名固定文件，内容以最后一次成功提取为准。
#
# ✅ 注意：push 到 nodes 分支用的是 GITHUB_TOKEN，默认权限下 GITHUB_TOKEN 触发的
# push 事件不会再启动新的 workflow run（GitHub 保护机制，防止递归触发），
# 因此既不需要 [skip ci]，也不会与 ci.yml（push: main / pull_request 触发）相互干扰；
# nodes 分支也没有 push 触发器挂到本 workflow 上（下方只有 schedule + workflow_dispatch）。
name: collect-nodes

on:
  schedule:
    - cron: '23 4 * * *'  # 每天 04:23 UTC（非整点）执行一次
  workflow_dispatch:

permissions:
  contents: write  # 允许 GITHUB_TOKEN push 到 nodes 分支

concurrency:
  group: nodes-collect
  cancel-in-progress: false  # 排队而非取消，避免并发写 nodes 分支

jobs:
  extract:
    name: Extract and publish nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract nodes (pure protocol PoW, no browser)
        id: extract
        run: |
          set -euo pipefail
          mkdir -p out
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "ts=${TS}" >> "$GITHUB_OUTPUT"

          set +e
          # --mode all：对 public config 里所有 available 的 connection-mode 各
          # regenerate 一份订阅，links.txt 每模式一行，content.txt 同序每模式一段。
          bun run bin/register.ts --pow --mode all --json --save-link out/links.txt --save-content out/content.txt > out/stdout.json 2> out/stderr.log
          rc=$?
          set -e

          # 先把产物文件与 stdout/stderr 中出现的关键字段（订阅链接等）全部 add-mask，
          # 之后任何日志输出即使包含这些值也会被 GitHub 自动打码。
          # grep 无匹配时 exit 1，会在 pipefail + set -e 下误判整步失败，故整套管道加 || true。
          for f in out/links.txt out/content.txt out/stdout.json out/stderr.log; do
            [ -f "$f" ] || continue
            { grep -oE '(https?|vmess|ss|trojan|vless)://[^[:space:]"'"'"'<>]+' "$f" || true; } | sort -u | while IFS= read -r u; do
              [ -n "$u" ] && echo "::add-mask::${u}"
            done
          done
          for f in out/links.txt out/content.txt; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done < "$f"
          done

          echo "register exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::register failed (exit ${rc}); last stderr lines (URLs masked):"
            tail -n 40 out/stderr.log || true
            exit "$rc"
          fi

          : > out/ok
          if ! test -s out/links.txt; then
            echo "::error::links file empty or missing"
            exit 1
          fi
          if ! test -s out/content.txt; then
            echo "::error::content file empty or missing"
            exit 1
          fi
          echo "links=$(wc -l < out/links.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish to orphan branch `nodes`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TS: ${{ steps.extract.outputs.ts }}
        run: |
          set -euo pipefail
          TODAY="${TS:0:8}"                     # YYYYMMDD (UTC, 取自提取时刻)
          PUB="${RUNNER_TEMP}/nodes-pub"
          TODAY_DIR="history/content/${TODAY}"

          git init -b nodes "${PUB}"
          cd "${PUB}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # nodes 已是 orphan：已存在则基于其 tip 续写历史；首次 push 直接创建。
          if git fetch --depth=1 origin nodes; then
            git checkout -B nodes FETCH_HEAD
          fi
          mkdir -p history/links "${TODAY_DIR}"

          # 从 GitHub workspace 拷贝本次 run 产物到 publish 工作区（两边 cwd 不同）。
          cp "${GITHUB_WORKSPACE}/out/links.txt"   out.links.txt
          cp "${GITHUB_WORKSPACE}/out/content.txt" out.content.txt

          # ============ 7 天滚动增量合并 ============
          # history/links/<YYYYMMDD>.txt    —— 当天提取的所有订阅 URL (一行一个)
          # history/content/<YYYYMMDD>/      —— 当天每个 URL 抓到的「原始」(base64) body
          #     <base64url(url)>.txt        —— 文件名是 URL 的 base64url，同 URL 多次提取会覆盖
          #
          # links.txt   = 近 7 天 (TODAY-6 .. TODAY) 的 links/*.txt 合并去重 (一行一个 URL)
          # content.txt = 近 7 天所有 URL 的最新 body 先 base64 解码、逐行聚合去重、再 base64
          #               —— 这是 v2ray/clash 类客户端最通用的「订阅」形态；只把 base64 外层
          #               拼接并不能让客户端读到多份订阅。

          TODAY="${TODAY}" TODAY_DIR="${TODAY_DIR}" python3 - <<'PYEOF'
          import base64, os, pathlib, re
          from datetime import datetime, timedelta, timezone

          today = os.environ["TODAY"]
          today_d = datetime.strptime(today, "%Y%m%d").replace(tzinfo=timezone.utc)
          cutoff = (today_d - timedelta(days=6)).strftime("%Y%m%d")  # 保留近 7 天

          pub = pathlib.Path(".")
          links_dir = pub / "history" / "links"
          content_root = pub / "history" / "content"
          out_links = pub / "out.links.txt"
          out_content = pub / "out.content.txt"


          def url_key(url: str) -> str:
              return base64.urlsafe_b64encode(url.encode("utf-8")).decode("ascii").rstrip("=")


          # ---- 1) 把当天 run 合并到 history/links/<YYYYMMDD>.txt ----
          day_links_file = links_dir / f"{today}.txt"
          existing = set()
          if day_links_file.exists():
              existing = {
                  ln.strip()
                  for ln in day_links_file.read_text(encoding="utf-8", errors="ignore").splitlines()
                  if ln.strip()
              }
          if out_links.exists():
              for ln in out_links.read_text(encoding="utf-8", errors="ignore").splitlines():
                  ln = ln.strip()
                  if ln:
                      existing.add(ln)
          day_links_file.write_text(
              "\n".join(sorted(existing)) + ("\n" if existing else ""), encoding="utf-8"
          )

          # ---- 2) 把当天 run 的 content 按 URL 分文件存到 history/content/<YYYYMMDD>/ ----
          # 对 content.txt 按「一个或多个空行」切成多段，第 i 段对应第 i 条 link；body 写到以
          # base64url(url) 命名的文件，同 URL 多次提取会覆盖。
          if out_links.exists() and out_content.exists():
              urls = [
                  ln.strip()
                  for ln in out_links.read_text(encoding="utf-8", errors="ignore").splitlines()
                  if ln.strip()
              ]
              raw = out_content.read_bytes()
              parts = [p for p in re.split(rb"\n\s*\n+", raw) if p.strip()]
              (content_root / today).mkdir(parents=True, exist_ok=True)
              for i, url in enumerate(urls):
                  if i >= len(parts):
                      break
                  (content_root / today / f"{url_key(url)}.txt").write_bytes(parts[i])

          # ---- 3) 丢弃早于 CUTOFF 的 history（保留 CUTOFF..TODAY 共 7 天） ----
          for f in links_dir.glob("*.txt"):
              stem = f.stem
              if re.fullmatch(r"\d{8}", stem) and stem < cutoff:
                  f.unlink()
          for d in content_root.iterdir():
              if d.is_dir() and re.fullmatch(r"\d{8}", d.name) and d.name < cutoff:
                  for f in d.iterdir():
                      f.unlink()
                  d.rmdir()

          # ---- 4) 由近 7 天 links 重建固定 links.txt ----
          merged_links = set()
          for i in range(7):
              d = (today_d - timedelta(days=i)).strftime("%Y%m%d")
              f = links_dir / f"{d}.txt"
              if f.exists():
                  for ln in f.read_text(encoding="utf-8", errors="ignore").splitlines():
                      ln = ln.strip()
                      if ln:
                          merged_links.add(ln)
          (pub / "links.txt").write_text(
              "\n".join(sorted(merged_links)) + ("\n" if merged_links else ""), encoding="utf-8"
          )

          # ---- 5) 由近 7 天 content 重建固定 content.txt ----
          # 同一 base64url URL key 在多日里让「更近日期」覆盖（i 越小越新，后写覆盖）。
          per_url = {}
          for i in range(6, -1, -1):
              d = (today_d - timedelta(days=i)).strftime("%Y%m%d")
              d_dir = content_root / d
              if not d_dir.is_dir():
                  continue
              for f in d_dir.glob("*.txt"):
                  per_url[f.stem] = f.read_bytes()

          decoded_lines = []
          seen = set()
          for url_key_str in sorted(per_url):  # 稳定输出顺序（按 URL key 字典序）
              raw_body = per_url[url_key_str].strip()
              if not raw_body:
                  continue
              # 尝试 base64 解码；失败则跳过该 URL 的 body（旧格式/损坏文件不阻塞当天流程）。
              body = raw_body.decode("ascii", errors="ignore")
              padding = "=" * ((4 - len(body) % 4) % 4)
              try:
                  decoded = base64.b64decode(body + padding).decode("utf-8", errors="ignore")
              except Exception:
                  continue
              for ln in decoded.splitlines():
                  ln = ln.rstrip()
                  if ln and ln not in seen:
                      seen.add(ln)
                      decoded_lines.append(ln)

          plain = ("\n".join(decoded_lines) + ("\n" if decoded_lines else "")).encode("utf-8")
          (pub / "content.txt").write_bytes(base64.b64encode(plain))
          PYEOF

          git add links.txt content.txt history
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          # 不加 [skip ci]：GITHUB_TOKEN 触发的 push 默认不再启动新的 workflow run
          # （GitHub 官方保护机制防递归），见文件顶部注释。
          git commit -m "nodes: links+content run ${GITHUB_RUN_ID} (${TS})"
          git push origin nodes
      - name: Summary
        if: always()
        run: |
          if [ -f out/ok ]; then
            TS="${{ steps.extract.outputs.ts }}"
            echo "- run id: \`${GITHUB_RUN_ID}\`"
            echo "- links extracted: \`${{ steps.extract.outputs.links }}\`"
            echo "- artifacts on \`nodes\` branch (固定路径，URL 永不变化):"
            echo "  - \`links.txt\`   -> raw.githubusercontent.com/${GITHUB_REPOSITORY}/nodes/links.txt"
            echo "  - \`content.txt\` -> raw.githubusercontent.com/${GITHUB_REPOSITORY}/nodes/content.txt"
          else
            echo "::warning::Extraction step failed — nothing was published. Re-run via Actions → collect-nodes → Run workflow."
          fi
